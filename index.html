function startSprint(){
  SP.pool = shuffle(PART1);
  SP.i = 0; SP.hit = 0; SP.streak = 0; SP.best = 0; SP.left = SP.dur; SP.live = true;
  clearInterval(SP.tick);
  SP.tick = setInterval(() => {
    SP.left--;
    if(SP.left <= 0){ SP.left = 0; endSprint(); }
    else paintHUD();
  }, 1000);
  renderSprintQ();
}

function paintHUD(){
  const t = $("#sp-time"), bar = $("#sp-bar");
  if(!t) return;
  t.textContent = SP.left;
  t.className = SP.left <= 10 ? "danger" : "";
  bar.style.width = (SP.left/SP.dur*100) + "%";
  bar.className = SP.left <= 10 ? "danger" : "";
}

function renderSprintQ(){
  if(!SP.live) return;
  const q = SP.pool[SP.i % SP.pool.length];
  app.innerHTML = `<div class="wrap"><section class="sprint">
    <dl class="sp-hud">
      <div><dt>남은 시간</dt><dd id="sp-time">${SP.left}</dd></div>
      <div><dt>맞힌 문항</dt><dd class="hot">${SP.hit}</dd></div>
      <div><dt>연속</dt><dd>${SP.streak}</dd></div>
    </dl>
    <div class="sp-track"><i id="sp-bar" style="width:${SP.left/SP.dur*100}%"></i></div>
    <div style="display:flex;gap:8px;align-items:center;margin-bottom:14px">
      <span class="diff ${DIFF_CLASS[q.diff]}">난이도 ${q.diff}</span>
      <span class="tag">${esc(q.comp)}</span>
    </div>
    <div class="sp-q">${esc(q.q)}</div>
    <div class="choices" id="sp-ch">${q.opts.map((o,i)=>
      `<button class="choice" data-i="${i}"><span class="bub">${i+1}</span><span>${esc(o)}</span></button>`).join("")}</div>
    <div id="sp-flash"></div>
    <div style="margin-top:22px"><button class="btn ghost" id="sp-stop">그만하기</button></div>
  </section></div>`;

  $("#sp-stop").onclick = endSprint;
  app.querySelectorAll("#sp-ch .choice").forEach(b => b.onclick = () => answerSprint(q, +b.dataset.i));
  paintHUD();
}

function answerSprint(q, pick){
  if(!SP.live) return;
  const ok = pick === q.a;
  if(ok){ SP.hit++; SP.streak++; SP.best = Math.max(SP.best, SP.streak); }
  else {
    SP.streak = 0;
    const d = DB();
    d.wrong[q.id] = {state:"no", mode:50, ts:Date.now()};
    saveDB(d);
  }
  app.querySelectorAll("#sp-ch .choice").forEach(b => {
    const i = +b.dataset.i;
    b.disabled = true;
    if(i === q.a) b.classList.add("correct");
    else if(i === pick) b.classList.add("wrong");
  });
  $("#sp-flash").innerHTML = `<div class="sp-flash ${ok?"ok":"no"}">${ok?"정답":"오답 · "+(q.a+1)+"번"}
    <span>${esc(q.topic)} — ${esc(firstSentence(q.why))}</span></div>`;
  clearTimeout(SP.next);
  SP.next = setTimeout(() => { SP.i++; renderSprintQ(); }, ok ? 900 : 2100);
}

function endSprint(){
  SP.live = false;
  clearInterval(SP.tick); clearTimeout(SP.next);
  const d = DB();
  const sp = Object.assign({60:0,120:0}, d.sprint || {});
  const prev = sp[SP.dur] || 0;
  const isBest = SP.hit > prev;
  if(isBest) sp[SP.dur] = SP.hit;
  d.sprint = sp;
  saveDB(d);
  const left = Object.keys(DB().wrong).length;

  app.innerHTML = `<div class="wrap"><section class="sprint"><div class="sp-end">
    <div class="eyebrow">${SP.dur}초 스프린트</div>
    <div class="sp-big" style="margin-top:10px">${SP.hit}</div>
    <div class="note" style="font-size:15px;margin-top:6px">문항 정답 · 최고 연속 ${SP.best}</div>
    <div class="sp-best">${isBest ? "새 최고 기록" : "최고 기록 " + (sp[SP.dur]||0) + "문항"}</div>
    <div style="margin-top:30px;display:flex;gap:9px;justify-content:center;flex-wrap:wrap">
      <button class="btn primary" id="sp-again">한 판 더</button>
      <button class="btn" id="sp-back">설정 바꾸기</button>
      ${left ? `<button class="btn" id="sp-wrong">오답 ${left}문항 정식으로 풀기</button>` : ""}
    </div>
    ${left ? `<p class="note" style="margin-top:18px">틀린 문항은 오답 노트에 저장됐습니다. 모의시험 탭에서도 이어서 풀 수 있습니다.</p>` : ""}
  </div></section></div>`;

  $("#sp-again").onclick = startSprint;
  $("#sp-back").onclick = renderSprintStart;
  if(left) $("#sp-wrong").onclick = () => { setRoute("exam"); startRun({wrongOnly:true, ids:wrongIds()}); };
}

  app.innerHTML = `<div class="wrap"><section class="prac" style="max-width:760px">
    <button class="pr-back" id="pr-back">← 챕터 목록</button>
    <div class="eyebrow">${esc(c.part)} · Chapter ${c.no}</div>
    <h1 style="font-size:clamp(24px,4.4vw,32px);font-weight:800;margin:10px 0 0;letter-spacing:-.04em">${esc(c.title)}</h1>
    <p class="note" style="margin-top:10px">${c.kind === "실습"
      ? "교재의 실습 과제입니다. 직접 수행한 뒤 예상 답안과 비교하세요."
      : "이 챕터는 실습 과제 대신 토론 질문이 제시됩니다. 정답이 하나로 정해져 있지 않으므로, 예상 답안은 논거를 갖춘 한 가지 견해로 참고하세요."}
      <a href="${c.url}" target="_blank" rel="noopener" style="margin-left:6px">교재 원문 열기 ↗</a></p>
    <div style="margin-top:24px">
      ${c.tasks.map((t,i) => {
        const st = prStatus(t);
        return `<button class="pr-task" data-i="${i}">
          <span class="pr-badge ${st==="done"?"":"gray"}">${LBL[st]}</span>
          <span class="tag">${esc(t.label)}</span>
          <span class="diff ${DIFF_CLASS[t.diff]}">${t.diff}</span>
          <span class="t">${esc(t.topic)}</span>
          <span class="pr-done">→</span>
        </button>`;
      }).join("")}
    </div>
  </section></div>`;

  $("#pr-back").onclick = renderPractice;
  app.querySelectorAll(".pr-task").forEach(b => b.onclick = () => renderPrTask(ch, +b.dataset.i));
}

/* --- 과제 상세 --- */
function renderPrTask(ch, i, showAns){
  hideChrome();
  const c = PRACTICE.find(x => x.ch === ch);
  const t = c.tasks[i];
  const rec = prState()[t.id] || {a:"", c:[]};

  app.innerHTML = `<div class="wrap"><section class="prac" style="max-width:760px">
    <button class="pr-back" id="pr-back">← ${esc(c.title)}</button>
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px">
      <span class="tag part">Chapter ${c.no}</span>
      <span class="tag">${esc(t.label)}</span>
      <span class="diff ${DIFF_CLASS[t.diff]}">난이도 ${t.diff}</span>
      <span class="tag pt">${esc(t.topic)}</span>
    </div>
    <div class="pr-q">${esc(t.q)}</div>
    <div class="pr-hint"><b>작성 가이드</b><span>${esc(t.hint)}</span></div>

    <div class="blk" style="margin-top:26px"><h4>내 답안</h4>
      <textarea class="answer-area" id="pr-ta" style="margin-top:0" placeholder="여기에 직접 작성하세요. 예상 답안을 먼저 보면 학습 효과가 크게 떨어집니다.">${esc(rec.a||"")}</textarea>
      <div class="count" id="pr-cnt"></div>
    </div>

    <div style="display:flex;gap:9px;flex-wrap:wrap;margin-top:6px">
      <button class="btn ${showAns?"":"primary"}" id="pr-toggle">${showAns?"예상 답안 접기":"예상 답안 보기"}</button>
      <button class="btn ghost" id="pr-prev" ${i===0?"disabled":""}>이전 과제</button>
      <button class="btn ghost" id="pr-next" ${i===c.tasks.length-1?"disabled":""}>다음 과제</button>
    </div>

    <div id="pr-ans">${showAns ? ansHTML(t, rec) : ""}</div>
  </section></div>`;

  const ta = $("#pr-ta"), cnt = $("#pr-cnt");
  const upd = () => cnt.textContent = ta.value.trim().length + "자";
  upd();
  ta.oninput = () => { upd(); prSave(t.id, {a:ta.value}); };

  $("#pr-back").onclick = () => renderPrChapter(ch);
  $("#pr-toggle").onclick = () => renderPrTask(ch, i, !showAns);
  $("#pr-prev").onclick = () => renderPrTask(ch, i-1);
  $("#pr-next").onclick = () => renderPrTask(ch, i+1);
  if(showAns) bindChecks(t);
}

function ansHTML(t, rec){
  const c = rec.c || [];
  const n = c.filter(Boolean).length;
  return `<div class="reveal" style="margin:26px 0 0;padding:22px;border:1px solid var(--rule);border-radius:3px">
    <div class="blk" style="margin-top:0"><h4>예상 답안</h4>
      <div class="model-ans">${esc(t.model)}</div></div>
    <div class="blk"><h4>점검 항목 — 내 답안에 포함된 것을 체크하세요</h4>
      <div class="rubric">${t.check.map((x,j)=>`
        <button class="rb" data-c="${j}" aria-pressed="${c[j]?"true":"false"}">
          <span class="bub">✓</span><span>${esc(x)}</span></button>`).join("")}
      </div>
      <div class="count">${n} / ${t.check.length} 충족${n===t.check.length?" · 완료 처리됨":""}</div>
    </div>
    <p class="note" style="margin-top:14px">예상 답안은 하나의 모범 사례일 뿐 유일한 정답이 아닙니다. 자신의 상황과 경험이 들어간 답안이 오히려 더 나을 수 있습니다. 점검 항목만 빠짐없이 다뤘다면 충분합니다.</p>
  </div>`;
}

function bindChecks(t){
  app.querySelectorAll(".rb").forEach(b => b.onclick = () => {
    const j = +b.dataset.c;
    const rec = prState()[t.id] || {a:"", c:[]};
    const arr = t.check.map((_,k) => (rec.c||[])[k] || false);
    arr[j] = !arr[j];
    prSave(t.id, {c:arr});
    const box = $("#pr-ans");
    box.innerHTML = ansHTML(t, prState()[t.id]);
    bindChecks(t);
  });
}

/* ===== 이론 탭 하위 화면 전환 ===== */
const TH_VIEWS = [{k:"comp", n:"역량별 정리"}, {k:"glossary", n:"용어 사전"}];
function segHTML(cur){
  return `<div class="seg" id="th-seg">${TH_VIEWS.map(v =>
    `<button data-v="${v.k}" aria-pressed="${v.k===cur}">${v.n}</button>`).join("")}</div>`;
}
function bindSeg(){
  const s = $("#th-seg");
  if(s) s.querySelectorAll("button").forEach(b => b.onclick = () => renderTheory(b.dataset.v));
}
function renderTheory(view){
  if((view || "comp") === "glossary") return renderGlossary();
  return renderTheoryComp();
}

/* ===== 용어 사전 ===== */
const G_CATS = ["기초","모델 구조","학습 방식","프롬프팅","위험과 검증","운영과 도구"];
const GS = {q:"", cat:"전체"};

function renderGlossary(){
  hideChrome();
  app.innerHTML = `<div class="wrap"><section class="prac">
    ${segHTML("glossary")}
    <div class="eyebrow" style="margin-top:26px">Glossary</div>
    <div class="pr-head">
      <h1>용어 ${GLOSSARY.length}개</h1>
      <div class="pr-stat">객관식에서 가장 자주 갈리는 지점은 <b>시험 포인트</b>로 표시</div>
    </div>
    <input class="g-search" id="g-q" type="search" placeholder="용어, 영문명, 설명으로 검색 (예: 환각, RAG, 인젝션)" value="${esc(GS.q)}">
    <div class="g-chips" id="g-chips">
      ${["전체"].concat(G_CATS).map(c =>
        `<button data-c="${esc(c)}" aria-pressed="${c===GS.cat}">${esc(c)}</button>`).join("")}
    </div>
    <div id="g-list"></div>
  </section></div>`;

  bindSeg();
  const inp = $("#g-q");
  inp.oninput = () => { GS.q = inp.value; paintGlossary(); };
  $("#g-chips").querySelectorAll("button").forEach(b => b.onclick = () => {
    GS.cat = b.dataset.c;
    $("#g-chips").querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b));
    paintGlossary();
  });
  paintGlossary();
}

function gMatch(g){
  if(GS.cat !== "전체" && g.c !== GS.cat) return false;
  const q = GS.q.trim().toLowerCase();
  if(!q) return true;
  return [g.t, g.en||"", g.d, g.n||"", (g.r||[]).join(" ")].join(" ").toLowerCase().includes(q);
}

function paintGlossary(){
  const box = $("#g-list");
  if(!box) return;
  const hits = GLOSSARY.filter(gMatch);
  if(!hits.length){
    box.innerHTML = `<p class="note" style="margin-top:30px">검색 결과가 없습니다. 다른 표현으로 찾아보거나 분류를 전체로 바꿔보세요.</p>`;
    return;
  }
  const cats = G_CATS.filter(c => hits.some(g => g.c === c));
  box.innerHTML = `<div class="g-count">${hits.length}개 표시${GS.q.trim()?` · '${esc(GS.q.trim())}' 검색`:""}</div>` +
    cats.map(c => `
      <div class="pr-part">${esc(c)}</div>
      ${hits.filter(g => g.c === c).map(g => `
        <div class="g-item">
          <div class="g-t">${esc(g.t)}${g.en?`<em>${esc(g.en)}</em>`:""}</div>
          <p class="g-d">${esc(g.d)}</p>
          ${g.n?`<p class="g-n"><b>시험 포인트</b> ${esc(g.n)}</p>`:""}
          ${g.r&&g.r.length?`<div class="g-r">${g.r.map(x=>`<button data-go="${esc(x)}">${esc(x)}</button>`).join("")}</div>`:""}
        </div>`).join("")}`).join("");

  box.querySelectorAll("[data-go]").forEach(b => b.onclick = () => {
    GS.q = b.dataset.go; GS.cat = "전체";
    renderGlossary();
    const inp = $("#g-q"); if(inp) inp.focus();
  });
}

</script>
</body>
</html>
